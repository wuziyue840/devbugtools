name: Dev Build (Test Only)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate test version file
        shell: pwsh
        run: |
          $VERSION = "0.0.0.${{ github.run_number }}"
          $BUILD = ${{ github.run_number }}
          $VERSION_TXT = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(0, 0, 0, $BUILD),
              prodvers=(0, 0, 0, $BUILD)
            ),
            kids=[
              StringFileInfo([
                StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'倾听风雨'),
                  StringStruct(u'FileDescription', u'开发者调试工具 (CI Build)'),
                  StringStruct(u'FileVersion', u'$VERSION'),
                  StringStruct(u'InternalName', u'devbugtools'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) 2026 wuziyue840'),
                  StringStruct(u'OriginalFilename', u'devbugtools.exe'),
                  StringStruct(u'ProductName', u'开发者调试工具'),
                  StringStruct(u'ProductVersion', u'$VERSION')])
              ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path version_info.txt -Value $VERSION_TXT -Encoding utf8

      - name: Build with PyInstaller (One-File)
        run: pyinstaller --noconsole --onefile --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devbugtools-test-build-${{ github.run_number }}
          path: dist/devbugtools.exe