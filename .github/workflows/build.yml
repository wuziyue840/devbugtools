name: Dev Build (Test Only)

on:
  push:
    branches: [ master, main ] # 日常推送到主分支时触发
  pull_request:
    branches: [ master, main ] # 提交 PR 时也触发，保证代码质量
  workflow_dispatch: # 允许手动点击运行

jobs:
  test-build:
    runs-on: windows-latest
    permissions:
      contents: read # 测试构建不需要写权限，最小化权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 测试构建的版本号：使用 0.0.0-ci 避免 Tag 逻辑报错
      - name: Generate test version file
        shell: pwsh
        run: |
          $VERSION = "0.0.0-ci.${{ github.run_number }}"
          $VERSION_ARR = $VERSION.Split(".")
          $VERSION_TXT = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($($VERSION_ARR[0]), $($VERSION_ARR[1]), $($VERSION_ARR[2]), 0),
              prodvers=($($VERSION_ARR[0]), $($VERSION_ARR[1]), $($VERSION_ARR[2]), 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'倾听风雨'),
                  StringStruct(u'FileDescription', u'开发者调试工具 (CI Build)'),
                  StringStruct(u'FileVersion', u'$VERSION'),
                  StringStruct(u'InternalName', u'devbugtools'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) 2026 wuziyue840'),
                  StringStruct(u'OriginalFilename', u'devbugtools.exe'),
                  StringStruct(u'ProductName', u'开发者调试工具'),
                  StringStruct(u'ProductVersion', u'$VERSION')])
              ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path version_info.txt -Value $VERSION_TXT -Encoding utf8

      - name: Build with PyInstaller (One-File)
        run: pyinstaller --noconsole --onefile --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devbugtools-test-build
          path: dist/devbugtools.exe