name: Dev Build (Test Only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Generate test version file
        shell: pwsh
        run: |
          $VERSION = "0.0.0.${{ github.run_number }}"
          $BUILD = ${{ github.run_number }}
          $VERSION_TXT = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(0, 0, 0, $BUILD),
              prodvers=(0, 0, 0, $BUILD)
            ),
            kids=[
              StringFileInfo([
                StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'倾听风雨'),
                  StringStruct(u'FileDescription', u'开发者调试工具 (CI Build)'),
                  StringStruct(u'FileVersion', u'$VERSION'),
                  StringStruct(u'InternalName', u'devbugtools'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) 2026 wuziyue840'),
                  StringStruct(u'OriginalFilename', u'devbugtools.exe'),
                  StringStruct(u'ProductName', u'开发者调试工具'),
                  StringStruct(u'ProductVersion', u'$VERSION')])
              ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path version_info.txt -Value $VERSION_TXT -Encoding utf8
      # Windows 使用分号 ;
      - run: pyinstaller --noconsole --onefile --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py
      - uses: actions/upload-artifact@v4
        with:
          name: devbugtools-test-build-win-${{ github.run_number }}
          path: dist/devbugtools.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      # macOS 使用冒号 : 且 --windowed 会生成 .app 包
      - run: pyinstaller --windowed --onedir --name devbugtools --add-data "assets:assets" main.py
      # 将 .app 打包成 zip
      - run: |
          cd dist
          zip -r devbugtools-macos-test-build-${{ github.run_number }}.zip devbugtools.app
      - uses: actions/upload-artifact@v4
        with:
          name: devbugtools-test-build-macos-${{ github.run_number }}
          path: dist/devbugtools-macos-test-build-${{ github.run_number }}.zip