name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 健壮性极强的版本号生成，手动触发或带后缀的 Tag 都不会崩
      - name: Generate version file
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          $VERSION = $TAG_NAME.TrimStart("v")
          $VERSION = $VERSION -replace '[^0-9.]', '.'
          $VERSION_ARR = $VERSION.Split(".") | Where-Object { $_ -ne "" }
          while ($VERSION_ARR.Count -lt 3) { $VERSION_ARR += "0" }
          $MAJOR = $VERSION_ARR[0]
          $MINOR = $VERSION_ARR[1]
          $PATCH = $VERSION_ARR[2]
          $BUILD = if ($VERSION_ARR.Count -gt 3 -and $VERSION_ARR[3] -match '^\d+$') { $VERSION_ARR[3] } else { "0" }
          
          $VERSION_TXT = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($MAJOR, $MINOR, $PATCH, $BUILD),
              prodvers=($MAJOR, $MINOR, $PATCH, $BUILD)
            ),
            kids=[
              StringFileInfo([
                StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'倾听风雨'),
                  StringStruct(u'FileDescription', u'开发者调试工具'),
                  StringStruct(u'FileVersion', u'$VERSION'),
                  StringStruct(u'InternalName', u'devbugtools'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) 2026 wuziyue840'),
                  StringStruct(u'OriginalFilename', u'devbugtools.exe'),
                  StringStruct(u'ProductName', u'开发者调试工具'),
                  StringStruct(u'ProductVersion', u'$VERSION')])
              ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path version_info.txt -Value $VERSION_TXT -Encoding utf8

      - name: Build with PyInstaller (One-File)
        run: pyinstaller --noconsole --onefile --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py

      - name: Build with PyInstaller (One-Folder)
        run: pyinstaller --noconsole --onedir --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py

      - name: Zip One-Folder
        shell: pwsh
        run: Compress-Archive -Path dist\devbugtools\* -DestinationPath dist\devbugtools-${{ github.ref_name }}-win-folder.zip

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          if (!(Test-Path "dist\devbugtools.exe")) { Throw "One-file EXE 构建失败！" }
          if (!(Test-Path "dist\devbugtools-${{ github.ref_name }}-win-folder.zip")) { Throw "One-folder ZIP 构建失败！" }

      - name: Generate SHA256
        shell: pwsh
        run: Get-FileHash dist\devbugtools.exe -Algorithm SHA256 | Select-Object Hash | Out-File -FilePath dist\devbugtools.exe.sha256 -Encoding ascii

      # 获取当天日期，拼接标签，如 v1.0.0-2026-09-26
      - name: Get Release Date
        id: date_info
        shell: pwsh
        run: |
          $TODAY = Get-Date -Format "yyyy-MM-dd"
          echo "today=$TODAY" >> $env:GITHUB_OUTPUT
          echo "display_name=${{ github.ref_name }}-$TODAY" >> $env:GITHUB_OUTPUT

      # 抓取 CHANGELOG 并强制替换标题行，不管你有没有写日期
      - name: Extract Release Body from CHANGELOG.md
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          $VERSION = $TAG_NAME.TrimStart("v")
          $TODAY = "${{ steps.date_info.outputs.today }}"
          $DISPLAY_TITLE = "${{ steps.date_info.outputs.display_name }}"
          
          if (Test-Path "CHANGELOG.md") {
              $content = Get-Content -Path "CHANGELOG.md" -Raw
              $pattern = "(?s)##\s*\[?$VERSION\]?.*?(?=\n##\s*\[|\Z)"
              $match = [regex]::Match($content, $pattern)
              if ($match.Success) {
                  $body = $match.Value
                  $body = $body -replace "(?m)^##\s*\[?$VERSION\]?.*$", "## $DISPLAY_TITLE"
                  $body | Out-File -FilePath "release_body.txt" -Encoding utf8
              } else {
                  "## $DISPLAY_TITLE`n`n未在 CHANGELOG.md 中找到版本 $VERSION 的更新说明。" | Out-File -FilePath "release_body.txt" -Encoding utf8
              }
          } else {
              "## $DISPLAY_TITLE`n`nCHANGELOG.md 文件不存在，请手动编辑更新说明。" | Out-File -FilePath "release_body.txt" -Encoding utf8
          }

      - name: Upload Artifacts for Debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.date_info.outputs.display_name }}"
          body_path: release_body.txt
          generate_release_notes: false
          files: |
            dist/devbugtools.exe
            dist/devbugtools-${{ github.ref_name }}-win-folder.zip
            dist/devbugtools.exe.sha256