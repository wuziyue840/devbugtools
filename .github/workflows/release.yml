name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows 构建
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 生成版本信息
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          $VERSION = $TAG_NAME.TrimStart("v") -replace '[^0-9.]', '.'
          $VERSION_ARR = $VERSION.Split(".") | Where-Object { $_ -ne "" }
          while ($VERSION_ARR.Count -lt 3) { $VERSION_ARR += "0" }
          $MAJOR, $MINOR, $PATCH = $VERSION_ARR[0], $VERSION_ARR[1], $VERSION_ARR[2]
          $BUILD = if ($VERSION_ARR.Count -gt 3 -and $VERSION_ARR[3] -match '^\d+$') { $VERSION_ARR[3] } else { "0" }
          $VERSION_TXT = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($MAJOR, $MINOR, $PATCH, $BUILD),
              prodvers=($MAJOR, $MINOR, $PATCH, $BUILD)
            ),
            kids=[
              StringFileInfo([
                StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'倾听风雨'),
                  StringStruct(u'FileDescription', u'开发者调试工具'),
                  StringStruct(u'FileVersion', u'$VERSION'),
                  StringStruct(u'InternalName', u'devbugtools'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) 2026 wuziyue840'),
                  StringStruct(u'OriginalFilename', u'devbugtools.exe'),
                  StringStruct(u'ProductName', u'开发者调试工具'),
                  StringStruct(u'ProductVersion', u'$VERSION')])
              ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path version_info.txt -Value $VERSION_TXT -Encoding utf8

      # 使用分号 ; 分隔
      - run: pyinstaller --noconsole --onefile --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py
      - run: pyinstaller --noconsole --onedir --name devbugtools --add-data "assets;assets" --version-file version_info.txt main.py
      - shell: pwsh
        run: Compress-Archive -Path dist\devbugtools\* -DestinationPath dist\devbugtools-${{ github.ref_name }}-win-folder.zip
      - shell: pwsh
        run: Get-FileHash dist\devbugtools.exe -Algorithm SHA256 | Select-Object Hash | Out-File -FilePath dist\devbugtools.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: dist/devbugtools.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win-folder-zip
          path: dist/devbugtools-${{ github.ref_name }}-win-folder.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win-sha256
          path: dist/devbugtools.exe.sha256

  # macOS 构建
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      # 使用冒号 : 分隔
      - run: pyinstaller --windowed --onedir --name devbugtools --add-data "assets:assets" main.py
      - run: |
          cd dist
          zip -r devbugtools-${{ github.ref_name }}-macos.zip devbugtools.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/devbugtools-${{ github.ref_name }}-macos.zip

  # 发布 (等双平台构建完再执行)
  release:
    needs: [build-windows, build-macos]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: 获取日期
        id: date_info
        shell: pwsh
        run: |
          $TODAY = Get-Date -Format "yyyy-MM-dd"
          echo "today=$TODAY" >> $env:GITHUB_OUTPUT
          echo "display_name=${{ github.ref_name }}-$TODAY" >> $env:GITHUB_OUTPUT

      # 抓取 CHANGELOG，并自动略过标题抓取正文
      - name: 提取 CHANGELOG 正文
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          $VERSION = $TAG_NAME.TrimStart("v")
          
          if (Test-Path "CHANGELOG.md") {
              $lines = Get-Content CHANGELOG.md
              $startFound = $false
              $bodyLines = @()
              
              foreach ($line in $lines) {
                  # 如果遇到 ## [1.0.0] 或 ## 1.0.0 或 ## v1.0.0，标记开始，并跳过这一行
                  if (-not $startFound -and $line -match "^##\s*\[?v?$VERSION\]?") {
                      $startFound = $true
                      continue
                  }
                  # 如果已开始，且遇到了下一个 ## 版本标题，立刻停止
                  if ($startFound -and $line -match "^##\s*\[?v?[0-9]") {
                      break
                  }
                  # 收集两个版本之间的内容
                  if ($startFound) {
                      $bodyLines += $line
                  }
              }
              
              # 输出清理后的内容
              ($bodyLines -join "`n").Trim() | Out-File -FilePath "release_body.txt" -Encoding utf8
          } else {
              "CHANGELOG.md 文件不存在。" | Out-File -FilePath "release_body.txt" -Encoding utf8
          }

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.date_info.outputs.display_name }}"
          body_path: release_body.txt
          generate_release_notes: false
          files: |
            all-artifacts/devbugtools.exe
            all-artifacts/devbugtools-${{ github.ref_name }}-win-folder.zip
            all-artifacts/devbugtools.exe.sha256
            all-artifacts/devbugtools-${{ github.ref_name }}-macos.zip